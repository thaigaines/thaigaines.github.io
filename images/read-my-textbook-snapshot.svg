<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Read My Textbook Python project snapshot</title><desc id="desc">A dark code editor showing the textbook audio pipeline.</desc><rect width="1200" height="800" fill="#0b1421"/><rect width="1200" height="66" fill="#132438"/><circle cx="34" cy="33" r="9" fill="#ff6b6b"/><circle cx="64" cy="33" r="9" fill="#ffd166"/><circle cx="94" cy="33" r="9" fill="#7ee7df"/><text x="140" y="40" fill="#a9bac8" font-family="monospace" font-size="20">read_my_textbook / main.py</text><rect x="978" y="18" width="180" height="30" rx="15" fill="#203b54"/><text x="1008" y="39" fill="#7ee7df" font-family="monospace" font-size="15">PYTHON PIPELINE</text><rect y="66" width="92" height="734" fill="#101e2f"/><g fill="#60788d" font-family="monospace" font-size="17"><text x="34" y="120">01</text><text x="34" y="160">02</text><text x="34" y="200">03</text><text x="34" y="240">04</text><text x="34" y="280">05</text><text x="34" y="320">06</text><text x="34" y="360">07</text><text x="34" y="400">08</text><text x="34" y="440">09</text><text x="34" y="480">10</text><text x="34" y="520">11</text><text x="34" y="560">12</text><text x="34" y="600">13</text><text x="34" y="640">14</text><text x="34" y="680">15</text><text x="34" y="720">16</text></g><g font-family="monospace" font-size="21" fill="#c3cfda"><text x="124" y="120"><tspan fill="#d7f66a">from</tspan> PyPDF2 <tspan fill="#d7f66a">import</tspan> PdfReader</text><text x="124" y="160"><tspan fill="#d7f66a">from</tspan> openai <tspan fill="#d7f66a">import</tspan> OpenAI</text><text x="124" y="200" fill="#7d8c9d"># Extract pages and turn them into audio</text><text x="124" y="240"><tspan fill="#7ee7df">for</tspan> page_num <tspan fill="#7ee7df">in</tspan> page_range:</text><text x="160" y="280">text = pdf_reader.pages[page_num]</text><text x="160" y="320">text = clean_text(text.extract_text())</text><text x="124" y="380"><tspan fill="#7ee7df">if</tspan> <tspan fill="#d7f66a">len</tspan>(text) &gt; 100:</text><text x="160" y="420">response = client.audio.speech.create(</text><text x="196" y="460" fill="#a9bac8">model=<tspan fill="#7ee7df">"tts-1"</tspan>, voice=<tspan fill="#7ee7df">"alloy"</tspan>,</text><text x="196" y="500" fill="#a9bac8">input=text)</text><text x="160" y="560">response.write_to_file(output_file)</text><text x="124" y="640" fill="#7ee7df">pygame.mixer.music.play()</text><text x="124" y="720" fill="#7d8c9d"># Listen page by page</text></g><rect x="920" y="690" width="220" height="54" rx="27" fill="#7ee7df"/><text x="958" y="724" fill="#0b1421" font-family="monospace" font-size="18">READ → LISTEN</text></svg>
