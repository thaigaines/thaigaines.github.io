<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Global Labor Explorer snapshot</title>
  <desc id="desc">A dark dashboard showing a world map colored by unemployment rate and a sector composition bar.</desc>
  <defs>
    <linearGradient id="heat" x1="0" x2="1">
      <stop offset="0" stop-color="#43b3ae"/><stop offset=".55" stop-color="#f4d35e"/><stop offset="1" stop-color="#ff8b52"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#08111f"/>
  <g fill="#f4f1e8" font-family="Arial, sans-serif">
    <text x="56" y="68" font-size="29" font-weight="700">◉ GLOBAL / LABOR</text>
    <text x="56" y="108" font-size="17" font-weight="700">One globe and one changing shape of work.</text>
    <text x="56" y="135" fill="#8796a8" font-size="12">A country-level view of unemployment and employment structure from 1991 to 2022.</text>
    <text x="56" y="178" fill="#f4f1e8" font-size="12" font-weight="700">01 / GLOBAL SNAPSHOT</text>
    <text x="56" y="215" font-size="21" font-weight="700">Unemployment across the world | 2022</text>
    <text x="56" y="239" fill="#8796a8" font-size="12">Hover a country to read its unemployment rate and sector shares.</text>
    <text x="1080" y="205" fill="#f4f1e8" font-size="11">REPORTED COUNTRIES</text>
    <text x="1080" y="240" font-size="30" font-weight="700">177</text>
  </g>
  <g opacity=".95" stroke="#22384b" stroke-width="3">
    <path fill="#4bb3ad" d="M112 327l76-43 91 18 38 57-40 38-56-9-36 41-46-24z"/>
    <path fill="#67c3ae" d="M315 315l48-44 75 14 52 40-28 50-63 5-36 53-40-45z"/>
    <path fill="#f4d35e" d="M494 307l45-42 54 9 26 54-37 19-17 62-47-28z"/>
    <path fill="#ff995a" d="M566 402l54-12 48 40-19 87-39 70-37-62 16-62z"/>
    <path fill="#62bdad" d="M660 286l90-30 95 26 57 58-40 33-58-9-44 50-57-39z"/>
    <path fill="#49aaa9" d="M822 386l65-34 76 32 42 66-44 47-50-21-44 38-35-54z"/>
    <path fill="#7cc6a9" d="M969 278l84 35 54 57-43 29-53-23-48-43z"/>
    <path fill="#f28c58" d="M1067 454l65-19 44 41-22 68-57-8-31-39z"/>
  </g>
  <g fill="#8796a8" font-family="Arial, sans-serif" font-size="11">
    <text x="1080" y="295">UNEMPLOYMENT RATE (%)</text>
    <rect x="1080" y="310" width="15" height="170" fill="url(#heat)"/>
    <text x="1105" y="320">20%</text><text x="1105" y="405">10%</text><text x="1105" y="486">0%</text>
    <text x="56" y="610" fill="#f4f1e8" font-weight="700">THE SHAPE OF JOBS</text>
    <text x="56" y="638">Sector composition · Uganda · 2014</text>
    <rect x="350" y="625" width="250" height="22" fill="#d7f66a"/><rect x="600" y="625" width="80" height="22" fill="#f4a261"/><rect x="680" y="625" width="220" height="22" fill="#43b3ae"/>
    <text x="350" y="672">Agriculture</text><text x="600" y="672">Industry</text><text x="750" y="672">Services</text>
  </g>
</svg>
